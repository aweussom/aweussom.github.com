<!DOCTYPE html>
<html lang="{{ DEFAULT_LANG }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ SITENAME }}{% endblock %}</title>
  {% block description %}{% endblock %}
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>⟲</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ SITEURL }}/theme/css/wossname.css">
  {% if FEED_ALL_ATOM %}
  <link rel="alternate" type="application/atom+xml" href="{{ FEED_DOMAIN }}/{{ FEED_ALL_ATOM }}" title="{{ SITENAME }} atom feed">
  {% endif %}
</head>
<body>
  <header class="site">
    <a class="wordmark" href="{{ SITEURL }}/">{{ SITENAME }}</a>
    <nav>
      <a href="{{ SITEURL }}/archives.html">archive</a>
      <a href="{{ BOOKS_URL }}">books</a>
      <a href="{{ DEVTO_PROFILE }}">dev.to</a>
      <a href="{{ GITHUB_URL }}">github</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site">
    <p>© Tommy Leonhardsen · wossname ⟲ aweussom · <a href="{{ FEED_DOMAIN }}/{{ FEED_ALL_ATOM }}">feed</a></p>
  </footer>
</body>
</html>
