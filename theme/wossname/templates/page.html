{% extends "base.html" %}
{% block title %}{{ page.title|striptags }} · {{ SITENAME }}{% endblock %}
{% block description %}{% if page.summary %}<meta name="description" content="{{ page.summary|striptags|truncate(160) }}">{% endif %}{% endblock %}
{% block content %}
  <article class="post page{% if page.slug %} page-{{ page.slug }}{% endif %}">
    <header>
      <h1>{{ page.title }}</h1>
    </header>
    {{ page.content }}
  </article>
{% endblock %}
